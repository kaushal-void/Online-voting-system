<!DOCTYPE html>
<html>
<head>
  <title>College Voting Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1>College Voting Portal</h1>
      <p class="subtitle">Secure online voting for college elections</p>

      <!-- Tabs -->
      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
      </div>

      <!-- FORM -->
      <form id="authForm">

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter college email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <!-- Register-only field -->
        <div id="confirmPasswordContainer" style="display:none;">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <button class="main-btn" id="submitBtn" type="submit">Login</button>

      </form>

      <p class="small-text">Verification through Email OTP / Login-based security</p>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const confirmContainer = document.getElementById("confirmPasswordContainer");
    const submitBtn = document.getElementById("submitBtn");

    let mode = "login";

    // Switch to LOGIN
    loginTab.onclick = () => {
      mode = "login";
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      confirmContainer.style.display = "none";
      submitBtn.innerText = "Login";
    };

    // Switch to REGISTER
    registerTab.onclick = () => {
      mode = "register";
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      confirmContainer.style.display = "block";
      submitBtn.innerText = "Register";
    };

    // FORM SUBMIT
    document.getElementById("authForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // Basic validation
      if (!email || !password) {
        alert("Fill all required fields");
        return;
      }

      if (mode === "register" && password !== confirmPassword) {
        alert("Passwords do not match");
        return;
      }

      // Simulated API call
      console.log("Mode:", mode);
      console.log("Email:", email);

      // Redirect (temporary)
      window.location.href = "organization.html";
    });
  </script>

</body>
</html>
