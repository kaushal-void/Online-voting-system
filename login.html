<!DOCTYPE html>
<html>
<head>
  <title>College Voting Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1>College Voting Portal</h1>
      <p class="subtitle">Secure online voting for college elections</p>

      <div class="tabs">
        <button class="active">Login</button>
        <button>Register</button>
      </div>

      <form>
        <label>Email Address</label>
        <input type="email" placeholder="Enter college email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <button class="main-btn" type="submit">Login</button>
      </form>

      <p class="small-text">Verification through Email OTP / Login-based security</p>
    </div>
  </div>

</body>
</html>
