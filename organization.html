<!DOCTYPE html>
<html>
<head>
  <title>Create or Join Organization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="org-container">
    <h1>Create or Join Organization</h1>
    <p class="subtitle">Manage your college election space securely</p>

    <div class="org-grid">

      <div class="org-card">
        <h2>Create Organization</h2>
        <p>For admins managing elections, voters, and candidates.</p>

        <label>Organization Name</label>
        <input type="text" placeholder="Example: ABC College">

        <label>Election Type</label>
        <input type="text" placeholder="Example: Class Representative">

        <button class="main-btn">Create Organization</button>
      </div>

      <div class="org-card">
        <h2>Join Organization</h2>
        <p>For students joining an existing voting organization.</p>

        <label>Organization Code</label>
        <input type="text" placeholder="Example: CR-ELECTION-2026">

        <button class="main-btn">Join Organization</button>
      </div>

    </div>
  </div>

</body>
</html>
